<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>考公行测 · 解锁式刷题</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

      <div class="brand">
        <h1 id="course-title">考公刷题</h1>
        <p id="course-sub">解锁式学习</p>
      </div>
      <div class="progress-wrap">
        <div class="progress-track">

      <!-- 动态渲染 -->

    <footer class="foot">纯静态 · 进度保存在本地浏览器 · 适合托管到 GitHub Pages</footer>

  <script src="js/data.js"></script>
