<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行测刷题 · 海量练习</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 刷题系统专用样式 */
    .quiz-home {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .quiz-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .quiz-header h1 {
      font-size: 32px;
      margin: 0 0 8px;
      background: linear-gradient(90deg, #2f6fed, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .quiz-header p { color: var(--muted); margin: 0 0 20px; }
    .quiz-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
    }
    .stat-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      text-align: center;
      min-width: 100px;
    }
    .stat-card .stat-num {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
    }
    .stat-card .stat-label {
      font-size: 12px;
      color: var(--muted);
    }
    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .quiz-card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
      transition: transform .2s, box-shadow .2s;
    }
    .quiz-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(47,111,237,.12);
    }
    .quiz-card .q-icon { font-size: 28px; margin-bottom: 10px; }
    .quiz-card h3 { margin: 0 0 4px; font-size: 16px; }
    .quiz-card .q-desc { color: var(--muted); font-size: 12px; margin: 0 0 10px; line-height: 1.5; }
    .quiz-card .q-meta {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .quiz-card .q-meta .rate { color: var(--ok); }
    .quiz-card .q-meta .wrong-badge { color: var(--bad); font-weight: 600; }
    .quiz-card .q-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .q-btn-start {
      padding: 7px 14px;
      font-size: 13px;
    }
    .q-btn-wrong {
      padding: 7px 14px;
      font-size: 13px;
      margin-left: auto;
    }

    /* 答题页 */
    .quiz-play {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .quiz-top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .quiz-progress { flex: 1; }
    .qp-bar {
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
    }
    .qp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width .3s;
    }
    .qp-text { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .quiz-timer {
      font-family: monospace;
      font-size: 16px;
      color: var(--muted);
      background: #eef1f6;
      padding: 6px 12px;
      border-radius: 6px;
    }
    .quiz-question {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.05);
    }
    .q-num {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      border-radius: 50%;
      font-size: 14px;
      margin-right: 8px;
    }
    .q-stem {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.7;
    }
    .q-tag {
      display: inline-block;
      background: #fff5f3;
      color: var(--bad);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 6px;
    }
    .q-options { display: flex; flex-direction: column; gap: 10px; }
    .q-opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      transition: all .15s;
      font-size: 14px;
    }
    .q-opt:hover { border-color: #b9c8ee; background: #f8faff; }
    .q-opt.selected { border-color: var(--primary); background: #eef3ff; }
    .q-opt-label {
      width: 24px;
      height: 24px;
      line-height: 22px;
      text-align: center;
      border: 1.5px solid var(--line);
      border-radius: 50%;
      font-size: 12px;
      flex-shrink: 0;
    }
    .q-opt.selected .q-opt-label {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .q-opt input { display: none; }
    .q-opt-text { line-height: 1.5; }
    .q-explain {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
    }
    .q-explain.ok { background: #e4f7ee; color: #0a6e3a; border: 1px solid #b7e0c6; }
    .q-explain.err { background: #fdecea; color: #9a3b30; border: 1px solid #f0c4bd; }
    .q-exp-head { font-weight: 700; margin-bottom: 8px; }
    .q-exp-body { margin: 6px 0; line-height: 1.6; }
    .quiz-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }
    .quiz-actions .btn { padding: 10px 22px; font-size: 14px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* 结果页 */
    .quiz-result {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .result-summary {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,.05);
      text-align: center;
      margin-bottom: 20px;
    }
    .result-summary h2 { margin: 0 0 20px; }
    .result-ring svg { width: 140px; height: 140px; }
    .ring-bg { fill: none; stroke: var(--line); stroke-width: 10; }
    .ring-fg {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 10;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 60px 60px;
    }
    .ring-fg { stroke: var(--primary); }
    .ring-text { font-size: 28px; font-weight: 700; fill: var(--ink); }
    .ring-label { font-size: 12px; fill: var(--muted); }
    .result-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .rs-item { text-align: center; }
    .rs-item b { display: block; font-size: 22px; }
    .rs-item span { font-size: 12px; color: var(--muted); }
    .rs-item.total b { color: var(--primary); }
    .rs-item.ok b { color: var(--ok); }
    .rs-item.err b { color: var(--bad); }
    .rs-item.skip b { color: #e8a020; }
    .rs-item.time b { color: var(--accent); }

    .result-detail {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.05);
      margin-bottom: 20px;
    }
    .result-detail h3 { margin: 0 0 16px; }
    .result-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .ri-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .ri-row:hover { color: var(--primary); }
    .ri {
      width: 20px; height: 20px;
      line-height: 20px;
      text-align: center;
      border-radius: 50%;
      font-size: 12px;
      color: #fff;
      flex-shrink: 0;
    }
    .ri.ok { background: var(--ok); }
    .ri.err { background: var(--bad); }
    .ri.skip { background: #e8a020; }
    .ri-num { font-weight: 600; }
    .ri-stem { flex: 1; color: var(--muted); }
    .ri-toggle { font-size: 12px; color: var(--primary); }
    .ri-detail {
      margin-top: 10px;
      padding: 10px 12px;
      background: #f8faff;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }
    .rd-answer { color: var(--muted); margin: 6px 0; }
    .rd-explain { margin: 6px 0; }

    .result-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* 错题本 */
    .quiz-wrongbook {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .wb-header { text-align: center; margin-bottom: 20px; }
    .wb-header h1 { font-size: 28px; margin: 0 0 6px; }
    .wb-header p { color: var(--muted); margin: 0; }
    .wb-section { margin-bottom: 24px; }
    .wb-section h2 {
      font-size: 18px;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .wb-count {
      font-size: 12px;
      background: #e4ecff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .wb-list { display: flex; flex-direction: column; gap: 12px; }
    .wb-item {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .wb-stem { font-weight: 600; margin-bottom: 8px; line-height: 1.6; }
    .wb-answer { font-size: 13px; color: var(--ok); margin-bottom: 6px; }
    .wb-explain { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
    .wb-actions { display: flex; gap: 8px; }
    .wb-actions .btn { padding: 6px 12px; font-size: 12px; }

    @media (max-width: 760px) {
      .quiz-grid { grid-template-columns: 1fr; }
      .quiz-stats { gap: 12px; }
      .stat-card { padding: 10px 16px; min-width: 80px; }
      .quiz-play { padding: 12px; }
      .quiz-question { padding: 18px; }
      .result-stats { gap: 12px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 动态渲染 -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/quiz-data.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
