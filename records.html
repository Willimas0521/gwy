<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行测刷题 · 记录与智能组卷</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 记录页专用样式 */
    .records-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px;
    }
    .rec-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .rec-header h1 {
      font-size: 30px;
      margin: 0 0 6px;
      background: linear-gradient(90deg, #2f6fed, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .rec-header p { color: var(--muted); margin: 0; }

    /* 总览卡片 */
    .rec-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .rec-card {
      background: #fff;
      border-radius: 14px;
      padding: 18px 14px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }
    .rec-card .rec-num {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
    }
    .rec-card.ok .rec-num { color: var(--ok); }
    .rec-card.err .rec-num { color: var(--bad); }
    .rec-card .rec-label {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* 区块 */
    .rec-section {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }
    .rec-section-head {
      margin-bottom: 16px;
    }
    .rec-section-head h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .rec-section-head p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }
    .rec-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    /* 薄弱列表 */
    .weak-list { display: flex; flex-direction: column; gap: 10px; }
    .weak-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: background .15s;
    }
    .weak-item:hover { background: #f8faff; }
    .wi-rank {
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      background: var(--line);
      border-radius: 50%;
      font-weight: 700;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .weak-item:nth-child(1) .wi-rank { background: #ff6b35; color: #fff; }
    .weak-item:nth-child(2) .wi-rank { background: #ffc107; color: #fff; }
    .weak-item:nth-child(3) .wi-rank { background: #ff9800; color: #fff; }
    .wi-info { flex: 1; min-width: 0; }
    .wi-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .wi-bar-wrap {
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .wi-bar {
      height: 100%;
      border-radius: 3px;
      transition: width .4s;
    }
    .wi-stats {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .wi-action { flex-shrink: 0; }

    /* 组卷配置 */
    .paper-config {
      background: #f8faff;
      border-radius: 12px;
      padding: 20px;
    }
    .pc-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .pc-row label {
      font-size: 14px;
      font-weight: 600;
      min-width: 100px;
    }
    .pc-row select {
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
    }
    .pc-weight-row { flex-direction: column; align-items: stretch; }
    .pc-weights {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .pc-weight-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .pw-label {
      flex: 1;
      font-size: 13px;
      min-width: 100px;
    }
    .pw-slider {
      width: 100px;
      accent-color: var(--primary);
    }
    .pw-value {
      width: 36px;
      text-align: right;
      font-weight: 600;
      font-size: 13px;
    }
    .pc-tip {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .pc-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }

    /* 试卷预览 */
    .paper-preview {
      margin-top: 16px;
      padding: 16px;
      background: #e4ecff;
      border-radius: 12px;
    }
    .paper-preview h3 { margin: 0 0 10px; }
    .paper-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pb-tag {
      background: #fff;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
    }
    .paper-actions {
      display: flex;
      gap: 10px;
    }

    /* 历史练习 */
    .session-list { display: flex; flex-direction: column; gap: 8px; }
    .session-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 13px;
    }
    .s-date { font-weight: 600; min-width: 120px; }
    .s-info { color: var(--muted); }

    @media (max-width: 760px) {
      .rec-overview { grid-template-columns: repeat(3, 1fr); }
      .weak-item { flex-wrap: wrap; }
      .wi-action { width: 100%; }
      .pc-weights { grid-template-columns: 1fr; }
      .pc-row { flex-direction: column; align-items: stretch; }
      .pc-row label { min-width: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 动态渲染 -->
  </div>

  <script src="js/quiz-data.js"></script>
  <script src="js/records.js"></script>
</body>
</html>
