        "3. 类比推理：给出一组相关词，找出逻辑关系最相似的选项；\n" +

      passRule: { needCorrect: 1, minAccuracy: 1.0 },

        { id: "q1", type: "choice", stem: "判断推理的四大子题型不包括？",

          explain: "判断推理包括图形推理、定义判断、类比推理和逻辑判断四大子题型，资料分析是独立的行测模块。" }

      lesson: "判断推理中常见的逻辑陷阱：\n\n" +

        "2. 以偏概全：用局部情况推导整体结论；\n" +

      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [

        "2. 定义判断：找准关键词，逐一与选项对比；\n" +
        "3. 类比推理：先找逻辑关系，再看词性、感情色彩；\n" +
        "4. 逻辑判断：先翻译题干，再运用逻辑规则推理。\n\n" +

      ]
    }
