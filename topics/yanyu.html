      <div class="progress-wrap"><div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="progress-text" id="progress-text">已通关 0 / 0</div></div>
      <ul id="kp-list"></ul>
      <div class="reset"><button class="btn ghost small" id="reset-btn">清空进度</button></div>

<script>
var TOPIC_ID = "yanyu";
var COURSE = {
  title: "言语理解与表达 · 解锁式刷题", subtitle: "逻辑填空·片段阅读·语句表达", version: 1,
  nodes: [
    { id: "kp1", title: "逻辑填空·语境分析法",
      lesson: "逻辑填空的核心是语境分析，通过空格前后的提示确定语义：\n\n" +
        "1. 解释类对应：空格后常有\"即、也就是说、冒号\"等；\n" +
        "2. 反对/转折对应：空格前有\"但、却、反之\"；\n" +
        "3. 并列对应：顿号、\"和\"连接的词感情色彩一致；\n" +
        "4. 递进对应：\"甚至、更\"表递进，程度加深。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "\"这部小说情节____，人物刻画却极为单薄。\" 横线处最合适当？",
          options: ["波澜不惊", "跌宕起伏", "索然无味", "平淡无奇"], answer: 1,
          explain: "\"却\"表转折，后文\"单薄\"偏负面，前文应取正面/丰富义，\"跌宕起伏\"形容情节曲折。" },
        { id: "q2", type: "choice", stem: "\"他做事向来____，从不开空头支票。\" 横线处应填？",
          options: ["言而有信", "夸夸其谈", "纸上谈兵", "好高骛远"], answer: 0,
          explain: "\"从不开空头支票\"是解释类对应，说明说话算数，对应\"言而有信\"。" }
      ]
    },
    { id: "kp2", title: "片段阅读·主旨概括",
      lesson: "主旨概括题要求准确把握文段核心观点：\n\n" +
        "1. 找主题句：文段的中心句，通常在段首或段尾；\n" +
        "2. 关注关联词：转折后、因果后的内容常是重点；\n" +
        "3. 行文脉络：总分、分总、总分总结构；\n" +
        "4. 干扰项：以偏概全、偷换概念、过度引申。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "\"近年来，我国数字经济发展迅猛，已成为推动经济高质量发展的重要引擎。然而，数字经济发展也面临着核心技术受制于人、数字鸿沟依然存在等问题。\" 这段文字的主旨是？",
          options: ["我国数字经济发展迅猛", "数字经济是高质量发展的引擎",
            "数字经济发展成就与挑战并存", "数字鸿沟问题亟待解决"], answer: 2,
          explain: "文段前半部分讲成就，后半部分用\"然而\"转折讲问题，主旨应涵盖两方面。" },
        { id: "q2", type: "choice", stem: "\"传统文化并非一潭死水，而是在历史长河中不断发展变化的。\" 这句话的核心观点是？",
          options: ["传统文化是静止的", "传统文化在不断演变",
            "传统文化历史悠久", "传统文化需要保护"], answer: 1,
          explain: "\"并非...而是...\"表对比，重点在\"而是\"之后，即传统文化在发展变化。" }
      ]
    },
    { id: "kp3", title: "片段阅读·意图判断",
      lesson: "意图判断题考查作者的写作目的和意图：\n\n" +
        "1. 明确意图：文段有明确观点，直接概括；\n" +
        "2. 隐含意图：需要根据内容推断作者未明说的意思；\n" +
        "3. 对策类：文段提出问题，意图往往是呼吁采取对策；\n" +
        "4. 注意区分\"主旨概括\"与\"意图判断\"的细微差别。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "\"我国每年因荒漠化造成的经济损失高达数千亿元，荒漠化面积仍在以每年数千平方公里的速度扩展。\" 作者的主要意图是？",
          options: ["描述荒漠化的现状", "呼吁重视荒漠化防治",
            "说明经济损失的严重", "介绍荒漠化扩展速度"], answer: 1,
          explain: "文段陈述了荒漠化的严重后果，作者意图在于呼吁重视荒漠化防治。" },
        { id: "q2", type: "choice", stem: "\"随着人工智能的发展，许多传统职业面临被替代的风险，但同时也催生了新的职业形态。\" 作者想表达的是？",
          options: ["人工智能取代传统职业", "人工智能创造新职业",
            "人工智能的双重影响", "应限制人工智能发展"], answer: 2,
          explain: "文段同时提到风险和机遇，意图在于说明人工智能的双重影响。" }
      ]
    },
    { id: "kp4", title: "语句排序·首尾句分析法",
      lesson: "语句排序题的解题步骤：\n\n" +
        "1. 看选项：确定首句范围，排除明显不能做首句的选项；\n" +
        "2. 找首句：一般是引出话题、提出观点、定义概念的句子；\n" +
        "3. 找尾句：总结性、结论性、展望性的句子常做尾句；\n" +
        "4. 找关联：通过指代词、关联词、逻辑关系确定相邻顺序。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "下列句子的正确排序是？\n①因此，我们需要加强环境保护\n②环境问题日益严重\n③这已经威胁到人类的生存和发展\n④只有这样才能实现可持续发展",
          options: ["②③①④", "②①③④", "①②③④", "③②①④"], answer: 0,
          explain: "②引出话题（环境问题严重），③进一步说明危害，①提出对策，④强调意义，逻辑通顺。" },
        { id: "q2", type: "choice", stem: "语句排序中，适合做首句的特征是？",
          options: ["含有\"因此\"的句子", "含有\"但是\"的句子", "引出话题或定义概念的句子", "含有指代词\"这\"的句子"], answer: 2,
          explain: "引出话题、定义概念、提出观点的句子适合做首句；含指代词、关联词后半部分的句子不适合。" }
      ]
    },
    { id: "kp5", title: "语句填空·话题一致性",
      lesson: "语句填空题的核心原则是话题一致性：\n\n" +
        "1. 保持话题统一：填入句子的话题应与上下文一致；\n" +
        "2. 保持逻辑连贯：注意因果、转折、递进等逻辑关系；\n" +
        "3. 保持句式协调：排比、对仗等修辞要求句式一致；\n" +
        "4. 关注前后暗示：空格前后的内容常给出明确提示。",
      passRule: { needCorrect: 1, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "\"读书可以让人开阔眼界，____，可以让人陶冶情操。\" 填入横线最恰当的是？",
          options: ["可以让人增长知识", "可以让人锻炼身体", "可以让人环游世界", "可以让人忘记烦恼"], answer: 0,
          explain: "句子采用排比结构，\"开阔眼界\"\"增长知识\"\"陶冶情操\"都是读书的积极作用，话题一致。" }
      ]
    }
  ]
};
</script>
