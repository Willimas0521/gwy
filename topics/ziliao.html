<script>
var TOPIC_ID = "ziliao";
var COURSE = {
  title: "资料分析 · 解锁式刷题", subtitle: "增长率·比重·倍数·综合分析", version: 1,
  nodes: [
    { id: "kp1", title: "增长率相关",
      lesson: "增长率是资料分析最核心的考点：\n\n" +
        "1. 基本公式：增长率 r = (现期 - 基期) / 基期 × 100%；\n" +
        "2. 现期 = 基期 × (1 + r%)；基期 = 现期 / (1 + r%)；\n" +
        "3. 同比与环比：同比指与去年同期比，环比指与上一周期比；\n" +
        "4. 速算技巧：百化分（1/8=12.5%）、截位直除、估算。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "某省2023年GDP为1200亿，2022年为1000亿，求增长率？",
          options: ["16.7%", "20%", "25%", "120%"], answer: 1,
          explain: "r = (1200-1000)/1000 = 200/1000 = 20%。" },
        { id: "q2", type: "choice", stem: "基期800，增长率12.5%，现期约为？",
          options: ["850", "875", "900", "925"], answer: 2,
          explain: "12.5% = 1/8，现期 ≈ 800 × (1+1/8) = 800×1.125 = 900。" }
      ]
    },
    { id: "kp2", title: "比重变化",
      lesson: "比重变化是资料分析的高频考点：\n\n" +
        "1. 基本公式：比重 = 部分 / 整体 × 100%；\n" +
        "2. 基期比重 = 现期比重 × (1+整体增长率) / (1+部分增长率)；\n" +
        "3. 比重变化判断：部分增长率 > 整体增长率，则比重上升；\n" +
        "4. 比重变化量 = 现期比重 - 基期比重。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "某省2023年GDP增长率为8%，其中第一产业增长率为5%。则第一产业占GDP的比重？",
          options: ["上升", "下降", "不变", "无法判断"], answer: 1,
          explain: "第一产业增长率(5%) < GDP增长率(8%)，所以第一产业占GDP的比重下降。" },
        { id: "q2", type: "choice", stem: "某市2023年总人口200万，同比增长2%；其中城镇人口120万，同比增长5%。城镇人口占总人口比重比上年？",
          options: ["上升", "下降", "不变", "无法判断"], answer: 0,
          explain: "城镇人口增长率(5%) > 总人口增长率(2%)，所以城镇人口占比上升。" }
      ]
    },
    { id: "kp3", title: "倍数与翻番",
      lesson: "倍数和翻番是资料分析的重要概念：\n\n" +
        "1. 倍数：A是B的几倍 = A/B；\n" +
        "2. 翻番：A翻n番 = A×2ⁿ；\n" +
        "3. 增长率与倍数的关系：增长率为r，则现期是基期的(1+r)倍；\n" +
        "4. 注意\"是...几倍\"与\"多...几倍\"的区别。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "2023年某公司营收5000万，2018年营收1000万，2023年营收是2018年的几倍？",
          options: ["4倍", "5倍", "6倍", "8倍"], answer: 1,
          explain: "5000/1000 = 5倍。" },
        { id: "q2", type: "choice", stem: "某指标从2018年到2023年翻了2番，2018年为100，2023年为？",
          options: ["200", "300", "400", "500"], answer: 2,
          explain: "翻2番 = 100 × 2² = 100 × 4 = 400。" }
      ]
    },
    { id: "kp4", title: "综合分析题",
      lesson: "综合分析题是资料分析的压轴题型：\n\n" +
        "1. 设问方式：通常要求判断多个说法的正误；\n" +
        "2. 解题策略：先简单后复杂，先看不需要计算的选项；\n" +
        "3. 常见陷阱：单位不一致、时间范围不匹配、概念混淆；\n" +
        "4. 时间分配：综合分析题耗时较长，建议放在最后做。",
      passRule: { needCorrect: 1, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "根据资料，以下说法正确的是？\nA. 2023年GDP增长率超过10%\nB. 第一产业占比上升\nC. 总人口增长率为2%\nD. 城镇人口超过总人口的60%",
          options: ["A说法正确", "B说法正确", "C说法正确", "D说法正确"], answer: 2,
          explain: "C项总人口增长率2%与之前计算一致，故选C。（注：此题需结合具体资料数据，此处为示例。实际考试中需仔细核对每个选项。）" }
      ]
    },
    { id: "kp5", title: "速算技巧①：尾数法与首数法",
      lesson: "尾数法、首数法用于加减和除法的快速定位，能在选项差异明显时秒杀：\n\n" +
        "1. 尾数法（加减）：多个数求和/差时，只看末一位（或末两位）即可确定结果尾数，用于排除选项；\n" +
        "2. 尾数法（乘除）：乘法看各因数末位乘积的尾数；\n" +
        "3. 首数法（除法）：做 A÷B 时，直接看商的最高位（首位/前两位）定位答案区间；\n" +
        "4. 用法：当四个选项的尾数各不相同、或首位各不相同时，优先用尾数/首数，避免完整计算。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "3467 + 2891 + 1523 计算结果的末位是？",
          options: ["1", "3", "5", "7"], answer: 0,
          explain: "末位相加：7+1+3=11，结果的末位为 1。" },
        { id: "q2", type: "choice", stem: "12345 ÷ 25 的商的最高位（首位）是？",
          options: ["3", "4", "5", "6"], answer: 1,
          explain: "12345÷25 = 493.8，商的首位是 4。" }
      ]
    },
    { id: "kp6", title: "速算技巧②：特征数字法（百化分）",
      lesson: "特征数字法（百化分）是增长率、基期、增长量速算的核心，务必背熟：\n\n" +
        "1. 常用百化分：1/2=50%、1/3≈33.3%、1/4=25%、1/5=20%、1/6≈16.7%、1/7≈14.3%、1/8=12.5%、1/9≈11.1%、1/11≈9.1%、1/12≈8.3%、1/15≈6.7%；\n" +
        "2. 基期：基期 = 现期/(1+r%)，当 r%≈1/n 时，基期 ≈ 现期×n/(n+1)；\n" +
        "3. 增长量：增长量 = 现期×r%/(1+r%) ≈ 现期/(n+1)；\n" +
        "4. 用法：遇到 12.5%、16.7%、25% 等特征值时，直接套 n 速算，省去除法。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "现期 240，同比增长 25%，求基期约为？",
          options: ["180", "192", "200", "216"], answer: 1,
          explain: "25%=1/4，基期 ≈ 240×4/5 = 192。" },
        { id: "q2", type: "choice", stem: "现期 480，同比增长 20%，增长量约为？",
          options: ["80", "96", "100", "120"], answer: 0,
          explain: "20%=1/5，增长量 ≈ 480/(5+1) = 80。" }
      ]
    },
    { id: "kp7", title: "速算技巧③：有效数字法与错位加减",
      lesson: "有效数字法和错位加减法用于复杂除法、分式的估算：\n\n" +
        "1. 有效数字法：保留分子、分母前 2-3 位有效数字，按位四舍五入（三七作五、五留双）；\n" +
        "2. 错位加减法：对分式 A/B，分子分母同加同减一个量使分母变整十整百，误差极小；\n" +
        "3. 示例：348/49 ≈ 350/50 = 7（分子+2、分母+1 近似）；\n" +
        "4. 取舍原则：选项差距较大（>5%）用截位直除，差距小（<5%）用错位加减保精度。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "估算 3476 ÷ 49 ≈ ？",
          options: ["68", "71", "75", "80"], answer: 1,
          explain: "3476÷49 ≈ 3500÷50 = 70，更精确约 70.9，选 71。" },
        { id: "q2", type: "choice", stem: "四个选项数值非常接近（差距<5%）时，估算应优先？",
          options: ["有效数字法截前两位", "错位加减法保精度", "尾数法", "首数法"], answer: 1,
          explain: "差距很小时截位误差会被放大，应用错位加减法保精度。" }
      ]
    },
    { id: "kp8", title: "分数大小比较技巧",
      lesson: "比重、倍数题中频繁比较分数大小，掌握方法可秒选：\n\n" +
        "1. 横向比较：分母相同比分子，分子大则分数大；\n" +
        "2. 纵向比较：分子相同比分母，分母小则分数大；\n" +
        "3. 化同法：把分子或分母化成相同/接近后再比较；\n" +
        "4. 差分法：比较大分数 A/B 与小分数 a/b，构造差分 (A-a)/(B-b)，若差分>小分数则 A/B 大，若差分<小分数则 A/B 小。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "比较 3/7 与 4/9，哪个更大？",
          options: ["3/7 更大", "4/9 更大", "两者相等", "无法判断"], answer: 1,
          explain: "3/7≈0.4286，4/9≈0.4444，故 4/9 更大。" },
        { id: "q2", type: "choice", stem: "分子相同时比较 5/8 与 5/12，哪个更大？",
          options: ["5/8 更大", "5/12 更大", "相等", "无法判断"], answer: 0,
          explain: "分子相同，分母越小分数越大，故 5/8 > 5/12。" }
      ]
    },
    { id: "kp9", title: "混合增长率与平均数增长率",
      lesson: "混合增长率和平均数增长率是难题提速的关键：\n\n" +
        "1. 混合增长率（线段法/十字交叉）：整体增速介于各部分增速之间，且偏向基数大的部分；\n" +
        "2. 线段法：部分 A、B 增速分居整体增速两侧，距离与基数成反比；\n" +
        "3. 平均数增长率 = (a-b)/(1+b%)，其中 a 为分子增速、b 为分母增速；\n" +
        "4. 平均数升降判断：分子增速 a > 分母增速 b，则平均数上升；反之下降。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "进口额同比增长 10%、出口额同比增长 20%，则总贸易额增速？",
          options: ["小于10%", "介于10%~20%之间", "介于20%~30%之间", "大于30%"], answer: 1,
          explain: "整体增速介于两部分增速之间，故在 10%~20% 之间。" },
        { id: "q2", type: "choice", stem: "产量同比增长 5%、单价同比增长 8%，总收入（产量×单价）同比增速约为？",
          options: ["13.0%", "13.4%", "14.0%", "15.0%"], answer: 1,
          explain: "总收入增速 ≈ 5%+8%+5%×8% = 13.4%。" }
      ]
    },
    { id: "kp10", title: "基期比重（进阶）",
      lesson: "基期比重用于求'去年'的比重，是比重考点的进阶题型：\n\n" +
        "1. 公式：基期比重 = 现期比重 × (1+整体增长率) / (1+部分增长率)；\n" +
        "2. 口诀：'基期比重等于现期比重，乘上（1+增长率）反过来'——整体增长率在分子、部分增长率在分母；\n" +
        "3. 速算判断：当 |整体增长率 − 部分增长率| 很小时，基期比重≈现期比重，只需判断升降；差距大时再用百化分或错位加减精算；\n" +
        "4. 推广：基期平均数、基期倍数、基期比值本质都是'基期比重'结构，统一套用本公式即可。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "某省2023年GDP 12000亿元，同比增长6%；其中工业增加值3000亿元，同比增长10%。求2022年工业增加值占GDP的比重约为？",
          options: ["约24.1%", "25.0%", "约25.9%", "约26.5%"], answer: 0,
          explain: "现期比重=3000/12000=25%；基期比重=25%×(1+6%)/(1+10%)=25%×1.06/1.10≈24.1%。" },
        { id: "q2", type: "choice", stem: "2023年A商品销量500万件（同比+8%），B商品销量200万件（同比+5%）。求2022年A销量是B销量的几倍（基期倍数）约为？",
          options: ["2.50倍", "2.57倍", "2.60倍", "2.43倍"], answer: 1,
          explain: "现期倍数=500/200=2.5；基期倍数=2.5×(1+8%)/(1+5%)=2.5×1.08/1.05≈2.57倍，即用基期比重公式结构计算基期倍数。" }
      ]
    },
    { id: "kp11", title: "隔级比重（单期比重）",
      lesson: "隔级比重用于处理'大集合—中集合—小集合'三级嵌套的占比问题：\n\n" +
        "1. 概念：已知小集合占中集合的比重、中集合占大集合的比重，求小集合占大集合的比重；\n" +
        "2. 公式：隔级比重 = (小集合/中集合) × (中集合/大集合) = 小集合/大集合；\n" +
        "3. 示例：学校(大集合)、班级(中集合)、班级内女同学(小集合)。班级女同学占全校比重 = (女同学/班级) × (班级/学校)；\n" +
        "4. 题型特征：题目通常分别给出'小占中'和'中占大'两个单期比重，直接相乘即得'小占大'，无需知道具体总量。",
      passRule: { needCorrect: 2, minAccuracy: 1.0 },
      exercises: [
        { id: "q1", type: "choice", stem: "某学校总人数10000人，其中甲班500人，甲班女同学250人。求甲班女同学占全校人数的比重约为？",
          options: ["2.5%", "5%", "25%", "50%"], answer: 0,
          explain: "隔级比重 = (250/500)×(500/10000) = 0.5×0.05 = 2.5%。" },
        { id: "q2", type: "choice", stem: "某省总人口中，A市占20%；A市人口中，城镇人口占60%。则A市城镇人口占全省比重约为？",
          options: ["12%", "20%", "32%", "60%"], answer: 0,
          explain: "隔级比重 = 20% × 60% = 12%，即两个单期比重直接相乘。" }
      ]
    }
  ]
};
